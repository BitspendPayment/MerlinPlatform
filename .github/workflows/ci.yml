name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: clippy and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # MerlinWallet's cosigner and ark crates generate protobuf code in their build scripts.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-
      # --locked: the lockfile pins secp256k1 0.32.0-beta.2, which is yanked, so a fresh resolve
      # would fail. It is also what makes the MerlinWallet commit here the one that is built.
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: tests
        run: cargo test --locked
